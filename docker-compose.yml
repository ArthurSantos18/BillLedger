services:
  postgres:
    image: postgres:16-alpine
    container_name: billledger-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=BillLedgerDb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BillLedgerDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billledger-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billledger-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=BillLedgerDb;Username=postgres;Password=${POSTGRES_PASSWORD};
    ports:
      - "8080:8080"
    volumes:
      - api-logs:/app/logs
    networks:
      - billledger-network

volumes:
  postgres-data:
  api-logs:

networks:
  billledger-network:
    driver: bridge